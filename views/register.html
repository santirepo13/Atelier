<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | ATELIER</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="globalLoader" class="global-loader">
  <div class="loader-spinner"></div>
</div>


<!-- Logo centrado -->
<img src="../img/imagenLogo.png" alt="Logo ATELIER" class="logo-login" />

<div class="login-box">
  <h2>Crear cuenta</h2>
  <div class="subtitle">ATELIER</div>

  <form id="registerForm" novalidate>
    <!-- Nombre de usuario -->
    <div class="form-group">
      <label for="displayName">Nombre de usuario</label>
      <input type="text" id="displayName" class="form-control" placeholder="Nombre de Usuario" required />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" class="form-control" placeholder="Correo" required />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="Contraseña" required />
    </div>

    <div class="form-group">
      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" class="form-control" placeholder="Confirmar contraseña" required />
    </div>

    <!-- Tipo de palabra clave -->
    <div class="form-group">
      <label for="clave">Palabra Clave</label>
      <select id="clave" class="form-control" required>
        <option selected disabled>Palabra Clave</option>
        <option value="1">Madre</option>
        <option value="2">Mascota</option>
        <option value="3">Color</option>
      </select>
    </div>

    <!-- Respuesta -->
    <div class="form-group">
      <label for="claveRespuesta">Respuesta a palabra clave</label>
      <input type="text" id="claveRespuesta" class="form-control" placeholder="Ej: Laura, Firulais, Azul" required />
    </div>

    <button type="submit" class="btn-primary">Registrarse</button>

    <div class="extra-links" style="margin-top:10px;">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
  </form>
</div>

<!-- Lógica de registro -->
<script type="module" src="../js/version.js"></script>

  <script type="module" src="../js/models/authModel.js"></script>
  <script type="module" src="../js/registro.js"></script>
</body>


</html>
