<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completar registro | ATELIER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="globalLoader" class="global-loader">
  <div class="loader-spinner"></div>
</div>

<img src="../img/imagenLogo.png" alt="Logo ATELIER" class="logo-login" />

<div class="login-box">
  <h2>Completar registro</h2>
  <div class="subtitle">ATELIER</div>
  <p style="text-align:center;font-size:0.9rem;color:#555;margin-bottom:20px;">
    Solo falta elegir un nombre de usuario y una palabra clave.
  </p>

  <form id="googleRegisterForm" novalidate>
    <div class="form-group">
      <label for="displayName">Nombre de usuario</label>
      <input type="text" id="displayName" class="form-control" placeholder="Nombre de Usuario" required />
    </div>

    <div class="form-group">
      <label for="clave">Palabra Clave</label>
      <select id="clave" class="form-control" required>
        <option selected disabled>Palabra Clave</option>
        <option value="1">Madre</option>
        <option value="2">Mascota</option>
        <option value="3">Color</option>
      </select>
    </div>

    <div class="form-group">
      <label for="claveRespuesta">Respuesta</label>
      <input type="text" id="claveRespuesta" class="form-control" placeholder="Ej: Laura, Firulais, Azul" required />
    </div>

    <button type="submit" class="btn-primary">Completar registro</button>
  </form>
</div>

<script type="module" src="../js/version.js"></script>
  <script type="module" src="../js/models/authModel.js"></script>
  <script type="module" src="../js/google-register.js"></script>
</body>

</html>
