<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión | ATELIER</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Hoja de estilos global -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="globalLoader" class="global-loader">
  <div class="loader-spinner"></div>
</div>


<!-- Logo centrado -->
<img src="../img/imagenLogo.png" alt="Logo ATELIER" class="logo-login">

<!-- Formulario -->
<div class="login-box">
  <h2>Iniciar sesión</h2>
  <div class="subtitle">ATELIER</div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="email" id="username" class="form-control" placeholder="Usuario" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
    </div>

    <div class="form-group">
      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" class="form-control" placeholder="Confirmar contraseña" required>
    </div>

    <!-- Tipo de palabra clave -->
    <div class="form-group">
      <label for="clave">Palabra Clave</label>
      <select id="clave" class="form-control" required>
        <option selected disabled>Palabra Clave</option>
        <option value="1">Madre</option>
        <option value="2">Mascota</option>
        <option value="3">Color</option>
      </select>
    </div>

    <!-- Respuesta -->
    <div class="form-group">
      <label for="claveRespuesta">Respuesta</label>
      <input type="text" id="claveRespuesta" class="form-control" placeholder="Tu respuesta" required>
    </div>

    <!-- Google -->
    <button type="button" class="google-btn">
      <img src="../img/logogoogle.png" alt="Google"> Continuar con Google
    </button>

    <div class="extra-links">
      <a href="#">¿Has olvidado tu contraseña?</a>
    </div>

    <button type="submit" class="btn-primary">Iniciar sesión</button>

    <div class="extra-links" style="margin-top:10px;">
      <a href="register.html">Regístrate aquí</a>
    </div>
  </form>
</div>

<script type="module" src="../js/auth-state.js"></script>
<script type="module" src="../js/models/authModel.js"></script>
<script type="module" src="../js/login.js"></script>
</body>


</html>
